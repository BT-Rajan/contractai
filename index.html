<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ContractAI – Enterprise AI Contract Drafting for GCC Legal Teams">
  <title>ContractAI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- App CSS -->
  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    /* Initial loading screen */
    #initial-load {
      position: fixed; inset: 0;
      background: #1a3c5e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; transition: opacity .4s ease;
    }
    #initial-load.fade { opacity: 0; pointer-events: none; }
    .init-icon {
      width: 64px; height: 64px; border-radius: 16px;
      background: #c9a84c; color: #1a3c5e;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 800; margin-bottom: 20px;
    }
    .init-name { color: #fff; font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .init-sub  { color: rgba(255,255,255,.5); font-size: 14px; margin-bottom: 32px; }
    .init-bar  { width: 200px; height: 3px; background: rgba(255,255,255,.2); border-radius: 3px; overflow: hidden; }
    .init-fill { height: 100%; background: #c9a84c; border-radius: 3px; animation: initLoad 1.2s ease forwards; }
    @keyframes initLoad { from { width: 0 } to { width: 100% } }
  </style>
</head>
<body>

<!-- Initial Loading Screen -->
<div id="initial-load">
  <div class="init-icon">C</div>
  <div class="init-name">ContractAI</div>
  <div class="init-sub">Enterprise AI Contract Drafting</div>
  <div class="init-bar"><div class="init-fill"></div></div>
</div>

<!-- SPA Mount Point -->
<div id="app"></div>

<!-- Toast Stack -->
<div class="toast-stack" id="toast-stack"></div>

<!-- Scripts -->
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script>
  // Remove initial loader once app JS boots
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const el = document.getElementById('initial-load');
      el.classList.add('fade');
      setTimeout(() => el.remove(), 400);
    }, 800);
  });

  // Apply tenant brand color dynamically after login
  window.applyBrandColor = function(color) {
    if (color) document.documentElement.style.setProperty('--navy', color);
  };

  // Apply RTL/LTR after login
  window.applyLang = function(lang) {
    const html = document.getElementById('html-root');
    if (lang === 'ar') { html.setAttribute('lang','ar'); html.setAttribute('dir','rtl'); }
    else               { html.setAttribute('lang','en'); html.setAttribute('dir','ltr'); }
  };
</script>
</body>
</html>
